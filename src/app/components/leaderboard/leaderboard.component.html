<div class="leaderboard">
  <div class="header">
    <h2>Leaderboard</h2>
    <button mat-raised-button color="warn" (click)="resetLeaderboard()">
      Reset Leaderboard
    </button>
  </div>

  <mat-card>
    <mat-card-content>
      <table mat-table [dataSource]="dataSource" class="mat-elevation-z0">
        <ng-container matColumnDef="rank">
          <th mat-header-cell *matHeaderCellDef>Rank</th>
          <td mat-cell *matCellDef="let player; let i = index">
            {{ i + 1 }}
          </td>
        </ng-container>

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Player</th>
          <td mat-cell *matCellDef="let player">{{ player.name }}</td>
        </ng-container>

        <ng-container matColumnDef="totalScore">
          <th mat-header-cell *matHeaderCellDef>Total Score</th>
          <td mat-cell *matCellDef="let player">{{ player.totalScore }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>

      <div *ngIf="players.length === 0" class="no-players">
        <p>No players recorded yet. Start a new match to see the leaderboard!</p>
      </div>
    </mat-card-content>
  </mat-card>
</div>
